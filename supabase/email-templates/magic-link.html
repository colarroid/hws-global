<!--
  Magic Link, rewritten to send a code.

  Paste into Authentication -> Emails -> Magic Link. Subject: "Your sign-in
  code". See README.md in this folder for why, and for the two settings that
  go with it.

  There is deliberately no {{ .ConfirmationURL }} anywhere below. A link in
  this email is a session sitting in an inbox that other people read.

  Inline styles only, and a table for the layout. Mail clients strip <style>
  blocks and most of them do not do flexbox.
-->
<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  style="background:#f9f6f1;margin:0;padding:32px 16px;"
>
  <tr>
    <td align="center">
      <table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        style="max-width:460px;background:#ffffff;border-radius:12px;padding:40px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;"
      >
        <tr>
          <td
            style="font-size:13px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:rgba(18,9,2,0.6);padding-bottom:20px;"
          >
            HWS Path Grid
          </td>
        </tr>

        <tr>
          <td
            style="font-size:22px;line-height:1.3;color:#120902;padding-bottom:10px;"
          >
            Your sign-in code
          </td>
        </tr>

        <tr>
          <td
            style="font-size:16px;line-height:1.6;color:rgba(18,9,2,0.7);padding-bottom:28px;"
          >
            Enter this on the page you have open. It works for 15 minutes.
          </td>
        </tr>

        <tr>
          <td
            align="center"
            style="background:#f7f3eb;border-radius:12px;padding:22px 16px;font-size:34px;font-weight:700;letter-spacing:0.28em;color:#120902;"
          >
            {{ .Token }}
          </td>
        </tr>

        <tr>
          <td
            style="font-size:15px;line-height:1.6;color:rgba(18,9,2,0.6);padding-top:28px;"
          >
            If you did not ask to sign in, you can ignore this. Nobody can get
            in without the code, and we will not email you again about it.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
